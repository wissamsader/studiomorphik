// New order on every visit. Shots of the same subject (same name, different number) are kept apart.
(function(){
  var main = document.querySelector('.rows'), a = Array.prototype.slice.call(main.children);
  function key(el){ return el.getAttribute('href').split('/').pop().replace('.webp', '').replace(/^\d+-/, '').replace(/-\d+$/, ''); }
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
  for (var i = 1; i < a.length; i++) {
    if (key(a[i]) !== key(a[i - 1])) continue;
    for (var j = i + 1; j < a.length; j++) if (key(a[j]) !== key(a[i - 1])) { var t = a[i]; a[i] = a[j]; a[j] = t; break; }
  }
  a.forEach(function(el){ main.appendChild(el); });
})();
// Arriving from a photo clicked on the home page (/mood/?photo=name): that photo leads the page, big on a row
// of its own, and the page lands on it, marked for a moment. A query, not a #hash, because Chrome resets the scroll for an unknown #hash.
(function(){
  var n = new URLSearchParams(location.search).get('photo'); if (!n) return;
  var main = document.querySelector('.rows'), el = main.querySelector('a[href="img/full/' + n + '.webp"]'); if (!el) return;
  main.insertBefore(el, main.firstChild); el.classList.add('lead');
  var img = el.querySelector('img'); img.removeAttribute('srcset'); img.removeAttribute('sizes'); img.loading = 'eager'; img.fetchPriority = 'high';
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  var marked = false;
  function go(){
    scrollTo(0, main.getBoundingClientRect().top + scrollY - 24);
    if (marked) return; marked = true; el.classList.add('hit');
    setTimeout(function(){ el.classList.remove('hit'); }, 2600);
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(go);
  addEventListener('load', function(){ setTimeout(go, 50); });
})();
