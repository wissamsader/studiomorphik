<style>
@font-face{font-family:'Integral CF';src:url('/fonts/IntegralCF-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
a{color:inherit;text-decoration:none}
html,body{overflow-x:clip}
body{background:#000;color:#f2efe9;font-family:'Inter Tight',Arial,sans-serif}
.top{position:relative;z-index:3;display:flex;justify-content:space-between;padding:18px clamp(14px,2.4vw,32px);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.top .wm{font-family:'Integral CF',sans-serif;letter-spacing:.22em}
.top nav{display:flex;gap:20px}.top nav a{opacity:.55}.top nav a:hover{opacity:1}

/* MOTION: a row of clips slides left behind the word (title_slide_zoom.py); some clips zoom slowly inside their boxes */
.big{position:relative;overflow:hidden;margin:-1.2vw 0 -.6vw;line-height:1}
.big .tr{position:absolute;top:0;left:0;height:100%;display:flex;will-change:transform}
.big .tr .tb{position:relative;flex:none;height:100%;overflow:hidden}
.big .tr video{display:block;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.big .tr video.z{animation:tz var(--zd,9s) ease-in-out var(--zp,0s) infinite;will-change:transform}
.big.off .tr video.z{animation-play-state:paused}
@keyframes tz{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.big .word{position:relative;display:block;background:#000;color:#fff;mix-blend-mode:multiply;font-family:'Anton',sans-serif;font-size:27.6vw;line-height:1;letter-spacing:-.015em;text-transform:uppercase;text-align:center;white-space:nowrap;padding:0 clamp(6px,1vw,14px)}

.meta{display:flex;justify-content:space-between;padding:10px clamp(14px,2.4vw,32px) 26px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
/* editorial modules: a module is a centred box of rows; a row is columns at one height; a column is one clip or a stack
   of two. --a is a column's share of its row (width per unit of height), --r its shape. The module's box is never wider
   than its lead row at height --h (--s = that row's total share, --k its column count), so a portrait is big by height
   and never stretched across a laptop; every row inside fills the box. */
.pad{--m:clamp(14px,2.4vw,32px);padding:0 var(--m)}
.book{--g:clamp(8px,.85vw,14px);--sp:clamp(26px,4vh,50px);padding-top:clamp(20px,4vh,48px)}   /* space between concepts: 57 px, then a bit less again (his call 11-02) */
.mod{--h:84vh;max-width:calc(var(--s) * var(--h) + (var(--k) - 1) * var(--g));margin-left:auto;margin-right:auto}
.mod.hh{--h:86vh}
#grid > section + section{margin-top:var(--sp)}
/* drifting rows, as idea 7's: edge to edge across the page, one concept per row, one height, a thin line between clips */
.drift{--rh:clamp(240px,44vh,480px);--lg:6px;margin-left:calc(-1 * var(--m));margin-right:calc(-1 * var(--m))}
.lane{position:relative;overflow:hidden;height:var(--rh)}
.belt{display:flex;gap:var(--lg);height:100%;width:max-content;will-change:transform}
.belt a.t{flex:none;height:100%;width:calc(var(--rh) * var(--ar))}
/* the sea: idea 7's pause, one clip still and big across the page, the stripe right under it */
.pause{margin:0 auto var(--lg);width:min(100%,160vh)}
.pause a.t{width:100%;aspect-ratio:var(--ar)}
.row{display:flex;align-items:flex-start;gap:var(--g)}
.row + .row{margin-top:var(--g)}
.c{flex:1 1 0%;flex-grow:calc(var(--a) * 100);min-width:0;aspect-ratio:var(--r)}
.c.st{display:flex;flex-direction:column;gap:var(--g)}
.c.st a{flex:1 1 0;min-height:0}
a.t{display:block;position:relative;overflow:hidden;background:#0b0b0b;cursor:zoom-in}
a.t video{display:block;width:100%;height:100%;object-fit:cover}
.cap{margin-top:16px;font-size:11px;letter-spacing:.08em;text-transform:lowercase;opacity:.45}
@media (max-width:640px){.book{--g:6px;--sp:16px}.mod{--h:80vh}.cap{margin-top:12px;font-size:10px}}
@media (max-width:760px){.drift{--rh:58vw;--lg:4px}.drift.L{--rh:40vw}.pause{width:100%}}
@media (max-width:760px){.top nav{gap:12px}}
/* phones: all three links show (his call 11-02: Photography / Video between Home and Contact); the menu words get a
   little smaller and tighter so they fit beside the wordmark, which stays as it is */
@media (max-width:480px){.top nav{gap:9px;font-size:10px;letter-spacing:.1em}}
@media (max-width:370px){.top nav{gap:7px;font-size:9px;letter-spacing:.06em}}
@media (max-width:340px){.top nav{gap:6px;letter-spacing:.02em}}
.end{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(40px,8vw,120px);line-height:.9;padding:12vw clamp(14px,2.4vw,32px) 3vw}
.end a{border-bottom:2px solid currentColor}
.rights{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px clamp(14px,2.4vw,32px) 30px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.5}
.lb{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.96);color:#f2efe9;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.lb.on{display:flex}
.lb video{max-width:92vw;max-height:88vh;object-fit:contain}
.lb button{position:absolute;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:16px;opacity:.75}
.lb button:hover{opacity:1}
.lb .x{top:8px;right:10px}.lb .p{left:4px;top:50%;transform:translateY(-50%)}.lb .n{right:4px;top:50%;transform:translateY(-50%)}
</style>
